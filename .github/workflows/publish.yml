name: Publish

# Posts are written by a scheduled Claude Code task (see ROUTINE.md), which uses the owner's
# Claude subscription. This workflow needs no secrets: it only merges content and deploys.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["content/**", "memory/**", "metrics/**", "site/**", "playbook.md", "sources.yaml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  sync:
    # The routine pushes to main when it can; otherwise to its session branch, merged here.
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: main, fetch-depth: 0 }
      - name: Merge content-only changes into main
        run: |
          git fetch origin "$GITHUB_REF"
          changed=$(git diff --name-only origin/main...FETCH_HEAD)
          echo "$changed"
          bad=$(echo "$changed" | grep -vE '^(content/|memory/|metrics/|playbook\.md$|sources\.yaml$)' || true)
          if [ -n "$bad" ]; then
            echo "::notice::Not auto-merging: branch changes files outside content paths:"; echo "$bad"
            echo "skip=1" >> "$GITHUB_ENV"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit FETCH_HEAD
          git push origin main

  deploy:
    needs: sync
    if: always() && (needs.sync.result == 'success' || needs.sync.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install markdown==3.7 pyyaml==6.0.2
      - id: pages
        uses: actions/configure-pages@v5
      - run: python site/build.py
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
