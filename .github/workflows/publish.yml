name: Publish

on:
  schedule:
    - cron: "17 5 * * *"   # daily 05:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Write a new post even if today's exists"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["content/**", "site/**"]   # manual edits redeploy without calling the model

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  produce:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Production loop
        run: python -m agent.produce ${{ inputs.force && '--force' || '' }}
      - name: Commit post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content memory metrics
          git diff --cached --quiet || git commit -m "post: $(date -u +%F)"
      - name: Learning loop (runs only every 4 new issues)
        run: python -m agent.learn
      - name: Commit learning
        run: |
          git add playbook.md sources.yaml memory metrics
          if ! git diff --cached --quiet; then git commit -F .learn-commit-msg; fi
          git push

  deploy:
    needs: produce
    if: always() && (needs.produce.result == 'success' || needs.produce.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - id: pages
        uses: actions/configure-pages@v5
      - run: python site/build.py
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
